<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Local Chat</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/base.css">
<script>!function(){try{var t=localStorage.getItem("chat-theme")||"dark",l=document.createElement("link");l.id="theme-css",l.rel="stylesheet",l.href="/static/themes/"+t+".css",document.head.appendChild(l)}catch(e){var c=document.createElement("link");c.id="theme-css";c.rel="stylesheet";c.href="/static/themes/dark.css";document.head.appendChild(c)}}()</script>
<noscript><link id="theme-css" rel="stylesheet" href="/static/themes/dark.css"></noscript>
</head>
<body>

<div id="sidebar">
  <h3>Groups<span id="close-sidebar">✕</span></h3>
  <ul id="groups"><li style="color:#666">Loading...</li></ul>
  <form id="new-group">
    <input placeholder="New group name..." id="group-name" required>
    <button type="submit">+</button>
  </form>
</div>

<div id="main">
  <div id="topbar">
    <button id="hamburger">☰</button>
    <span>👤</span>
    <select id="user-id"></select>
    <select id="theme-select"></select>
    <span id="group-title">—</span>
    <span id="search-wrap" class="hidden">
      <input id="search-input" placeholder="Search..." maxlength="100">
      <a id="search-clear" class="hidden">✕</a>
    </span>
    <span id="search-info" class="hidden"></span>
  </div>
  <div id="msgs">
    <div id="empty-state">
      <span id="empty-icon">💬</span>
      <span id="empty-text">Select group from sidebar to start chatting</span>
    </div>
    <button id="scroll-bottom-btn" class="hidden">↓</button>
  </div>
  <span id="typing-indicator" class="hidden"></span>
  <div id="input-area" class="hidden">
    <div class="replying hidden" id="reply-bar"><span id="reply-preview"></span><a id="cancel-reply">✕</a></div>
    <button id="emoji-btn">😊</button>
    <textarea id="msg-text" placeholder="Type message... (Enter send, Shift+Enter ↵)" rows="1" autofocus></textarea>
    <button id="send-btn">Send</button>
  </div>
</div>

<script type="module" src="/static/app.js"></script>
</body>
</html>
